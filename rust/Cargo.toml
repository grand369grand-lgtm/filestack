[package]
name = "filecore"
version = "0.1.0"
edition = "2021"
description = "Native search / sort / indexing core for the Filestack file manager (Expo + Rust)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
